name: Build Skill Bundle

on:
  release:
    types: [published]
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create properly structured zip
        run: |
          # Create temp directory with correct structure
          mkdir -p skill-bundle
          cp -r information-literacy scam-detection skill-bundle/
          
          # Create zip without the repo name nesting
          cd skill-bundle
          zip -r ../information-literacy.skill information-literacy/
          zip -r ../scam-detection.skill scam-detection/
          
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: information-literacy.skill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: scam-detection.skill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
